name: Build Mac Mouse Fix

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Mac Mouse Fix App
        run: |
          xcodebuild -project "Mouse Fix.xcodeproj" \
            -scheme "App - Release" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package App into Zip
        run: |
          cd build/Build/Products/Release
          codesign --force --deep --sign - "Mac Mouse Fix.app"
          zip -r -y MacMouseFix.zip "Mac Mouse Fix.app"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacMouseFix-App
          path: build/Build/Products/Release/MacMouseFix.zip
